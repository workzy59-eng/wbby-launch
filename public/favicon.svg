<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Main Gold Circle -->
  <circle cx="50" cy="50" r="48" fill="#c7c42a" />
  
  <!-- Outer Rings -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="white" stroke-width="1.5" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="white" stroke-width="1" />
  
  <!-- Top Text: SINCE 2026 -->
  <path id="topCurve" d="M 30 25 Q 50 15 70 25" fill="none" />
  <text fill="white" font-family="Inter, sans-serif" font-size="3.5" font-weight="500" text-anchor="middle">
    <textPath href="#topCurve" startOffset="50%">SINCE 2026</textPath>
  </text>
  
  <!-- Horizontal Bar and Main Text -->
  <rect x="0" y="41" width="100" height="18" fill="#c7c42a" />
  <text x="50" y="54" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-weight="900" font-size="11" fill="#fff9e6" style="letter-spacing: 0.2px; filter: drop-shadow(0px 1px 1px rgba(0,0,0,0.1))">WEBBYLAUNCH</text>
  
  <!-- Bottom Text: TURNING VISION INTO REALITY -->
  <path id="bottomCurve" d="M 20 75 Q 50 90 80 75" fill="none" />
  <text fill="white" font-family="Inter, sans-serif" font-size="3.2" font-weight="700" text-anchor="middle" style="letter-spacing: 0.1px">
    <textPath href="#bottomCurve" startOffset="50%">TURNING VISION INTO REALITY</textPath>
  </text>
</svg>
