<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Premium Dark Base Circle -->
  <circle cx="50" cy="50" r="48" fill="#0a0a0c" />
  
  <!-- Glowing Gold Brand Outer Border -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#c7c42a" stroke-width="2.5" />
  
  <!-- Spherical Globe Grid Lines (Latitudes and Longitudes) -->
  <!-- Horizontal Equator & Latitude Arcs -->
  <line x1="14" y1="50" x2="86" y2="50" stroke="#ffffff" stroke-width="1" opacity="0.25" />
  <path d="M 18 35 Q 50 42 82 35" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.18" />
  <path d="M 18 65 Q 50 58 82 65" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.18" />
  
  <!-- Vertical Meridians & Longitude Arcs -->
  <line x1="50" y1="14" x2="50" y2="86" stroke="#ffffff" stroke-width="1" opacity="0.25" />
  <ellipse cx="50" cy="50" rx="28" ry="42" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.18" />
  <ellipse cx="50" cy="50" rx="14" ry="42" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.22" />
  
  <!-- Dynamic, High-Speed Futuristic 'W' Monogram -->
  <path d="M 27 34 
           L 37 34 
           L 46 58 
           L 50 46 
           L 54 46 
           L 58 58 
           L 67 34 
           L 77 34 
           L 63 68 
           L 53 68 
           L 50 58 
           L 47 68 
